[package]
name = "duckity"
version = "1.1.0"
edition = "2024"
documentation = "https://duckity.com/docs/sdks/rust"
license = "MIT"

[dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
reqwest = { version = "0.13.2", features = ["json"], optional = true }
rug = { version = "1.30.0", default-features = false, features = ["integer"] }
serde = { version = "1.0.228", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.149", default-features = false, features = ["alloc"] }
sha2 = { version = "0.11.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0.18", default-features = false }
tokio = { version = "1.53.1", default-features = false }

[dev-dependencies]
actix-web = "4.15.0"
anyhow = { version = "1.0.104", features = ["backtrace"] }
async-compat = "0.2.5"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
dotenvy = "0.15.7"
smol = "2.0.2"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
warp = { version = "0.4.3", features = ["server"] }

[features]
default = ["std"]
std = ["dep:reqwest"]
