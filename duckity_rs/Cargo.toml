[package]
name = "duckity"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
reqwest = { version = "0.13.2", features = ["json"] }
rug = "1.29.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.18"

[dev-dependencies]
anyhow = { version = "1.0.104", features = ["backtrace"] }
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
dotenvy = "0.15.7"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
