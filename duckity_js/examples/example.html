<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Duckity @duckity/js Example</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        width: 300px;
      }

      input,
      button {
        padding: 0.5rem;
      }
    </style>
  </head>
  <body>
    <h1>@duckity/js Example</h1>

    <form id="form">
      <input
        type="email"
        name="email"
        id="input-email"
        placeholder="Email"
        required
      />
      <input
        type="password"
        name="password"
        id="input-password"
        placeholder="Password"
        required
      />
      <button type="submit">Submit</button>
    </form>

    <script type="module">
      import * as duckity from "../dist/index.js";

      const PROTECTION_PROFILE_ID = "idp-r4-dpQmaQYq1s4uAW";

      console.log("Starting solution...")
      console.time("solution")
      let solution = await duckity.solve(PROTECTION_PROFILE_ID, { api: "http://localhost:3210/v1" });
      console.timeEnd("solution")
      console.log("Solution", solution)

      const form = document.getElementById("form");
      const inputEmail = document.getElementById("input-email");
      const inputPassword = document.getElementById("input-password");

      function handleSubmit(e) {
        e.preventDefault();

        const email = inputEmail.value;
        const password = inputPassword.value;

        alert("Submitted!");
      }

      form.addEventListener("submit", handleSubmit);
    </script>
  </body>
</html>
